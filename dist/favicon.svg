<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Navy Gradient for House Body -->
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4D8C" />
      <stop offset="50%" stop-color="#0B2B5B" />
      <stop offset="100%" stop-color="#041530" />
    </linearGradient>

    <!-- Gold Gradient for Upper Needle -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Silver/White Gradient for Lower Needle -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#041530" flood-opacity="0.35" />
    </filter>

    <filter id="innerShadow">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feOffset dx="0" dy="4"/>
      <feComposite operator="out" in2="SourceAlpha" result="inverse"/>
      <feFlood flood-color="#000000" result="color"/>
      <feComposite operator="in" in2="inverse" result="shadow"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Main House Structure -->
  <g filter="url(#shadow)">
    <!-- House Outer Path with Smooth Curves -->
    <path d="
      M 256 50
      C 268 50, 276 56, 285 64
      L 435 200
      C 445 209, 450 220, 442 228
      C 436 235, 424 233, 415 225
      L 415 370
      C 415 398, 392 420, 364 420
      L 148 420
      C 120 420, 97 398, 97 370
      L 97 225
      C 88 233, 76 235, 70 228
      C 62 220, 67 209, 77 200
      L 227 64
      C 236 56, 244 50, 256 50
      Z
    " fill="url(#houseGrad)" stroke="#2563EB" stroke-width="2" stroke-opacity="0.3"/>

    <!-- Inner Circle Cutout / Inset Dial -->
    <circle cx="256" cy="265" r="105" fill="#041530" stroke="#1E4D8C" stroke-width="4" filter="url(#innerShadow)" />
    <circle cx="256" cy="265" r="103" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="3" />

    <!-- Rotated Compass Needle Pointer -->
    <g transform="rotate(38 256 265)">
      <!-- Top Gold Needle Half -->
      <polygon points="256,120 286,265 256,265" fill="url(#goldGrad)" />
      <polygon points="256,120 226,265 256,265" fill="#D97706" />

      <!-- Bottom White Needle Half -->
      <polygon points="256,410 286,265 256,265" fill="url(#silverGrad)" />
      <polygon points="256,410 226,265 256,265" fill="#94A3B8" />

      <!-- Center Pivot Dial -->
      <circle cx="256" cy="265" r="26" fill="#FFFFFF" />
      <circle cx="256" cy="265" r="16" fill="#0B2B5B" />
    </g>

    <!-- Top-Right Sparkle Accent Dot -->
    <circle cx="370" cy="142" r="7" fill="#FBBF24" />
  </g>
</svg>
